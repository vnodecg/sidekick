x-sidekick: &sidekick
  build: .
  ports:
    - "127.0.0.1:${PORT:-3000}:3000"
  volumes:
    - sidekick-data:/data
  restart: unless-stopped

services:
  sidekick:
    <<: *sidekick
    environment:
      SIDEKICK_MOCK_AI: "1"
      SIDEKICK_TZ: ${SIDEKICK_TZ:-UTC}
      SIDEKICK_ALLOWED_ORIGINS: ${SIDEKICK_ALLOWED_ORIGINS:-}

  sidekick-bedrock:
    <<: *sidekick
    profiles: ["bedrock"]
    environment:
      SIDEKICK_TZ: ${SIDEKICK_TZ:-UTC}
      SIDEKICK_ALLOWED_ORIGINS: ${SIDEKICK_ALLOWED_ORIGINS:-}
      AWS_REGION:
      SIDEKICK_BEDROCK_MODEL_ID:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:

volumes:
  sidekick-data:
