x-sidekick: &sidekick
  build: .
  ports:
    - "127.0.0.1:${PORT:-3000}:3000"
  volumes:
    - sidekick-data:/data
  restart: unless-stopped

services:
  sidekick:
    <<: *sidekick
    environment:
      SIDEKICK_MOCK_AI: "1"
      SIDEKICK_TZ: ${SIDEKICK_TZ:-UTC}
      SIDEKICK_ALLOWED_ORIGINS: ${SIDEKICK_ALLOWED_ORIGINS:-}
      SIDEKICK_AUTH_TOKEN:
      SIDEKICK_ALLOW_OPEN_BIND: "1"

  sidekick-bedrock:
    <<: *sidekick
    profiles: ["bedrock"]
    environment:
      SIDEKICK_TZ: ${SIDEKICK_TZ:-UTC}
      SIDEKICK_ALLOWED_ORIGINS: ${SIDEKICK_ALLOWED_ORIGINS:-}
      SIDEKICK_AUTH_TOKEN:
      SIDEKICK_ALLOW_OPEN_BIND: "1"
      AWS_REGION:
      SIDEKICK_BEDROCK_MODEL_ID:
      AWS_BEARER_TOKEN_BEDROCK:

volumes:
  sidekick-data:
